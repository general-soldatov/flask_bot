meta:
  environment: python
  toolchain:
    name: pip
    version: "3.14"
build:
  requirementsPath: requirements.txt
  useCache: true
run:
  persistenceMount: /data
  command: gunicorn --bind 0.0.0.0:5000 -k uvicorn.workers.UvicornWorker flask_app:app
  containerPort: 5000
  russianTrustedCa: false
  singleton: true
  zeroDowntime: false
